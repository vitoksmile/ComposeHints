name: Publish
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Retrieve Version
        run: echo "VERSION_NAME=$(./gradlew -q :hints:printVersionName)" >> $GITHUB_ENV

      - name: Publish Library
        run: |
          echo "Publishing and Releasing ${{ env.VERSION_NAME }}"
          ./gradlew :hints:publish
          echo "Published and Released ${{ env.VERSION_NAME }}"
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ env.VERSION_NAME }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}

      - name: Create and push tag
        run: |
          git config --global user.email "vitoksmile@gmail.com"
          git config --global user.name "$GITHUB_ACTOR"
          git tag -a $TAG -m "Release v$TAG"
          git push origin $TAG
        env:
          TAG: ${{ env.VERSION_NAME }}

      - name: Extract Release Notes
        id: release_notes
        run: |
          python3 -c "
          import sys, re
          version = sys.argv[1]
          with open('CHANGELOG.md') as f:
              content = f.read()
          pattern = r'(?s)##\s+\[?' + re.escape(version) + r'\]?(?:\([^\)]+\))?\s*(.*?)(?=\n##\s+\[|\Z)'
          match = re.search(pattern, content)
          notes = match.group(1).strip() if match else f'Release v{version}'
          with open('release_notes.md', 'w') as out:
              out.write(notes)
          " "${{ env.VERSION_NAME }}"

      - name: Create Release on GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.VERSION_NAME }} \
            --title "${{ env.VERSION_NAME }}" \
            --notes-file release_notes.md \
            --target main
